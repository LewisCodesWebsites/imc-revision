name: IMCDaily
options:
  bundleIdPrefix: com.lewiscodes
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  IMCDaily:
    type: application
    platform: iOS
    sources:
      - path: IMCDaily
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lewiscodes.imcdaily
        PRODUCT_NAME: IMCDaily
        INFOPLIST_FILE: IMCDaily/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
